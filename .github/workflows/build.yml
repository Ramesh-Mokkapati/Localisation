name: CI

on:
  push:
    branches: ["main", "master"]
    tags:     ["v*.*.*"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: ${{ matrix.configuration }}|x64
    runs-on: windows-2022
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      # ── Build ──────────────────────────────────────────────────────────────
      # Builds all six projects in one pass:
      #   EnglishDLL, FrenchDLL, GermanDLL  (resource-only satellite DLLs)
      #   CommandLine, SDIApp, DialogApp     (host applications)
      # /m enables parallel compilation; solution dependencies ensure the DLLs
      # are built before the apps that load them at runtime.
      - name: Build
        run: |
          msbuild Localisation.sln `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /m `
            /v:minimal `
            /nologo
        shell: pwsh

      # All six outputs land in the shared bin directory. The DLLs are placed
      # beside the executables so LoadLibrary("FrenchDLL.dll") etc. resolve
      # without any extra PATH configuration.
      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.configuration }}-x64
          path: bin/x64/${{ matrix.configuration }}/
          if-no-files-found: error

  # ── Merge ───────────────────────────────────────────────────────────────────
  # Combine the per-configuration artifacts into a single named archive so
  # consumers download one zip instead of two.
  merge:
    name: Merge ${{ matrix.configuration }} artifacts
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Merge into single ${{ matrix.configuration }} archive
        uses: actions/upload-artifact/merge@v6
        with:
          name: ${{ matrix.configuration }}
          pattern: ${{ matrix.configuration }}-*
          delete-merged: true

  # ── Release ─────────────────────────────────────────────────────────────────
  # On a v*.*.* tag, publish the Release apps and language DLLs as a GitHub
  # Release (Localisation-<tag>-x64.zip). Waits for the merge job, which
  # deletes Release-x64 after folding it into the "Release" artifact.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write       # required to create / update a GitHub Release
    steps:
      - name: Download Release artifact
        uses: actions/download-artifact@v8
        with:
          name: Release
          path: package

      # Only the runnable files: CommandLine/SDIApp/DialogApp + English/French/German DLLs.
      - name: Zip package
        run: |
          cd package
          zip "../Localisation-${{ github.ref_name }}-x64.zip" *.exe *.dll

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Localisation-${{ github.ref_name }}-x64.zip
          generate_release_notes: true   # auto-generates notes from merged PRs / commits
          # v1.2.0-rc1 etc. become pre-releases, so they never count as the "latest" release
          # that downstream packaging (the ComponentSuite installer) picks up.
          prerelease: ${{ contains(github.ref_name, '-') }}
